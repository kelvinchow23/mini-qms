# SOP-004-A02 Gate requirements (appendix to SOP-004; revised with it)
G0: {passed_by: approval, requires: [00_planning/plan.yaml, roles.yaml]}
G1: {passed_by: formal_review, requires: [01_requirements/requirements.yaml, 01_requirements/risks.csv]}
G2: {passed_by: formal_review, requires: [design review minutes with no open actions, or actions carried forward]}
G3: {passed_by: formal_review, requires: [03_release/parts.csv, 03_release/bom.csv, 03_release/test_procedures/]}
G4: {passed_by: approval, requires: ["builds/B00n/release.yaml for every unit", "NC records closed or dispositioned"]}
G5: {passed_by: approval, requires: [lessons learned in worklog.md or a close-out note]}
