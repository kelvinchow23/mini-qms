# SOP-004-A02 Gate requirements (appendix to SOP-004; revised with it)
# Records each gate needs (SOP-004 section 3). CI blocks a gate whose records are missing.
G0: {passed_by: approval, requires: [00_planning/plan.yaml, roles.yaml]}
G1: {passed_by: formal_review, requires: [01_requirements/requirements.yaml, 01_requirements/risks.csv]}
G2: {passed_by: formal_review, requires: [design review minutes, 03_build_package/parts.csv, 03_build_package/bom.csv, 03_build_package/test_procedures/, 03_build_package/assembly/, 03_build_package/inspection_checks.csv]}
G3: {passed_by: formal_review, requires: ["builds/B00n/build.yaml, inspection.csv, trace.csv", "builds/B00n/test_results.csv covering every requirement verified by test"]}
G4: {passed_by: formal_review, requires: ["builds/B00n/release.yaml for every unit", "NC records closed or dispositioned", lessons learned in worklog.md or a close-out note, 00_planning/scorecard.csv]}
